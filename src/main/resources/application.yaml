spring:
  application:
    name: subtracker

  datasource:
    url: jdbc:postgresql://localhost:5432/subtracker_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:cok-uzun-ve-guvenli-bir-secret-key-buraya-en-az-32-karakter}
  expiration-ms: 86400000 #24saat

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:./firebase-service-account.json}